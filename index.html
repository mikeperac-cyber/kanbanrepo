<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark light" />
    <title>Kanban Repo Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <img class="brand-mark" src="assets/icon-64.png" alt="" width="30" height="30" />
          <div class="brand-copy">
            <h1>Repo Board</h1>
            <p>4 accounts &middot; notes &amp; checklists</p>
          </div>
        </div>

        <div class="header-actions">
          <label class="search-wrap" for="repo-search">
            <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.35-4.35" />
            </svg>
            <input id="repo-search" class="search-input" type="search" maxlength="120" placeholder="Search repos, notes, tasks…" autocomplete="off" aria-label="Search repositories, notes, and tasks" data-focus-key="search" />
          </label>

          <div class="select-wrap">
            <select class="sort-select" id="repo-sort" aria-label="Sort repositories" data-focus-key="sort">
              <option value="pinnedFirst">Pinned first</option>
              <option value="recentlyUpdated">Recently updated</option>
              <option value="oldest">Oldest first</option>
              <option value="name">Name A–Z</option>
            </select>
            <svg class="select-chevron" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </div>

          <button class="toggle-btn" id="pinned-toggle" type="button" aria-pressed="false">
            <svg class="icon-star" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 3.8 2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.75-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z" />
            </svg>
            <span>Pinned only</span>
          </button>

          <button class="toggle-btn" id="archive-toggle" type="button" aria-pressed="false">Show archived</button>

          <span class="store-badge" id="store-badge" hidden>Microsoft Store</span>
          <span class="repo-total" id="repo-total">0 repos</span>

          <button class="icon-btn" id="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme">
            <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.1" />
              <path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20.2 14.4A8.4 8.4 0 0 1 9.6 3.8 8.4 8.4 0 1 0 20.2 14.4Z" />
            </svg>
          </button>
        </div>
      </header>

      <aside class="sidebar" aria-label="Accounts">
        <h2 class="sidebar-title">Accounts</h2>
        <button
          class="account-tile account-tile-all"
          id="all-accounts"
          type="button"
          data-focus-key="account:all"
          aria-pressed="true"
          title="Show every account"
        >
          <span class="account-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3.2" y="4" width="6.6" height="16" rx="1.6" />
              <rect x="14.2" y="4" width="6.6" height="16" rx="1.6" />
            </svg>
          </span>
          <span class="account-name">All accounts</span>
          <span class="account-count" id="all-accounts-count">0</span>
          <span class="account-sub">Full board</span>
        </button>
        <div class="account-list" id="account-list"></div>
      </aside>

      <div class="tag-bar" id="tag-bar" hidden>
        <span class="tag-bar-label">Tags</span>
        <div class="tag-bar-list" id="tag-bar-list" role="group" aria-label="Filter repos by tag"></div>
        <button class="tag-clear" id="tag-clear" type="button" hidden>Clear filter</button>
      </div>

      <main class="board" id="board" aria-label="Repository columns"></main>

      <footer class="app-footer">
        <span class="status" id="save-status" role="status" aria-live="polite">Saved locally</span>
        <span class="footer-dot" aria-hidden="true">&middot;</span>
        <span class="version" id="version-label">v1.4.0</span>
        <span class="footer-spacer"></span>
        <span class="footer-hint">Click a repo to open its checklist &middot; Drag repos to move them</span>
      </footer>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Account column -->
    <template id="column-template">
      <section class="column">
        <header class="column-head">
          <span class="accent-dot" aria-hidden="true"></span>
          <h2 class="column-title"></h2>
          <span class="count-badge" title="Repos on this column">0</span>
          <button class="column-import" type="button" title="Import public repositories from GitHub">Import</button>
          <button class="column-color" type="button" title="Change column color">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3.4a8.6 8.6 0 1 0 0 17.2c1.4 0 2.2-.9 2.2-2 0-.7-.3-1.2-.3-1.9 0-1 .8-1.8 1.9-1.8h1.5c1.8 0 3.3-1.5 3.3-3.3A8.6 8.6 0 0 0 12 3.4Z" />
              <circle cx="8.4" cy="9.4" r="1.15" fill="currentColor" stroke="none" />
              <circle cx="12.4" cy="7.2" r="1.15" fill="currentColor" stroke="none" />
              <circle cx="16.2" cy="9.8" r="1.15" fill="currentColor" stroke="none" />
            </svg>
          </button>
        </header>

        <form class="add-form" novalidate>
          <input
            class="add-input"
            type="text"
            placeholder="Paste a repo URL…"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
          <button class="add-btn" type="submit">Add</button>
        </form>

        <div class="repo-list" role="list"></div>

        <div class="note-wrap">
          <div class="note-head">Account note</div>
          <div
            class="note"
            contenteditable="plaintext-only"
            role="textbox"
            aria-multiline="true"
            data-placeholder="Add a short note…"
          ></div>
        </div>
      </section>
    </template>

    <!-- Repository row -->
    <template id="repo-template">
      <article class="repo">
        <div class="repo-head">
          <button class="repo-grip" type="button" title="Drag to move this repo">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" aria-hidden="true">
              <circle cx="9" cy="6" r="1.6" /><circle cx="15" cy="6" r="1.6" />
              <circle cx="9" cy="12" r="1.6" /><circle cx="15" cy="12" r="1.6" />
              <circle cx="9" cy="18" r="1.6" /><circle cx="15" cy="18" r="1.6" />
            </svg>
          </button>
          <button class="repo-star" type="button">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
              <path d="m12 3.8 2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.75-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z" />
            </svg>
          </button>
          <button class="repo-title" type="button"></button>
          <div class="repo-actions">
            <button class="repo-expand" type="button" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
            <button class="repo-edit" type="button">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17 3.8a2.4 2.4 0 0 1 3.4 3.4L7.6 20 3 21.4 4.4 16.8Z" />
                <path d="m14.8 6 3.4 3.4" />
              </svg>
            </button>
            <button class="repo-archive" type="button">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="3.6" width="18" height="4.6" rx="1.2" />
                <path d="M5 8.2v10.2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.2" />
                <path class="archive-arrow" d="M12 18v-6M9.4 14.4 12 11.8l2.6 2.6" />
              </svg>
            </button>
            <button class="repo-remove" type="button">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6.5h16M9.5 6.5V4.8a1.3 1.3 0 0 1 1.3-1.3h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7" />
                <path d="M6.5 6.5 7.4 19a1.6 1.6 0 0 0 1.6 1.5h6a1.6 1.6 0 0 0 1.6-1.5l.9-12.5" />
              </svg>
            </button>
          </div>
        </div>

        <div class="repo-meta">
          <span class="repo-url"></span>
          <span class="repo-tags"></span>
          <span class="repo-badges"></span>
        </div>

        <div class="repo-note">
          <svg class="repo-note-icon" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 3.6h14a1.4 1.4 0 0 1 1.4 1.4v10.2l-5.4 5.4H5A1.4 1.4 0 0 1 3.6 19.2V5A1.4 1.4 0 0 1 5 3.6Z" />
            <path d="M20.4 15.2H15v5.4" />
          </svg>
          <input class="repo-note-input" type="text" placeholder="Add a note…" />
        </div>

        <div class="repo-detail" hidden>
          <div class="detail-head">
            <span>Checklist</span>
            <span class="todo-count"></span>
          </div>
          <ul class="todo-list"></ul>
          <div class="todo-empty">No tasks yet</div>
          <form class="todo-form">
            <input class="todo-input" type="text" placeholder="Add a task…" />
            <button class="todo-add" type="submit">Add</button>
          </form>
          <div class="detail-head">Notes</div>
          <textarea class="repo-note-full" rows="3" placeholder="Capture setup steps, decisions, links, and ideas…"></textarea>
        </div>
      </article>
    </template>

    <div class="color-pop" id="card-color-pop" hidden>
      <div class="color-pop-head">
        <span>Column color</span>
        <button class="color-pop-close" id="card-color-close" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="swatches swatches-sm" id="card-swatches" role="radiogroup" aria-label="Column color"></div>
      <div class="custom-color">
        <label class="custom-color-label" for="card-color-input">Custom</label>
        <input class="custom-color-input" id="card-color-input" type="color" value="#6366f1" />
        <span class="custom-color-hex" id="card-color-hex">Auto</span>
      </div>
    </div>

    <dialog class="repo-dialog" id="repo-dialog" aria-labelledby="repo-dialog-title">
      <form class="repo-form" id="repo-form" novalidate>
        <header class="dialog-head">
          <div>
            <h2 id="repo-dialog-title">Repo details</h2>
            <p class="dialog-sub" id="repo-dialog-sub">Label, tags, priority, due date and color.</p>
          </div>
          <button class="dialog-close" id="repo-dialog-close" type="button" aria-label="Close">&times;</button>
        </header>

        <label class="field">
          <span class="field-label">Repository URL</span>
          <input class="field-input" id="repo-url" type="text" spellcheck="false" autocomplete="off" />
        </label>

        <label class="field">
          <span class="field-label">Label <span class="field-optional">optional</span></span>
          <input
            class="field-input"
            id="repo-label"
            type="text"
            maxlength="60"
            placeholder="e.g. VS Code extension"
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span class="field-label">Tags <span class="field-optional">comma separated</span></span>
          <input
            class="field-input"
            id="repo-tags"
            type="text"
            maxlength="180"
            list="tag-suggestions"
            placeholder="work, frontend, urgent"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <datalist id="tag-suggestions"></datalist>

        <div class="dialog-row">
          <label class="field">
            <span class="field-label">Priority</span>
            <select class="field-input" id="repo-priority">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Due date <span class="field-optional">optional</span></span>
            <input class="field-input" id="repo-due" type="date" />
          </label>
        </div>

        <fieldset class="field color-field">
          <legend class="field-label">Repo color</legend>
          <div class="swatches" id="repo-swatches" role="radiogroup" aria-label="Repo color"></div>
          <div class="custom-color">
            <label class="custom-color-label" for="repo-color-input">Custom</label>
            <input class="custom-color-input" id="repo-color-input" type="color" value="#6366f1" />
            <span class="custom-color-hex" id="repo-color-hex">Auto</span>
          </div>
        </fieldset>

        <div class="dialog-actions">
          <button class="btn-ghost" id="repo-cancel" type="button">Cancel</button>
          <button class="btn-primary" id="repo-save" type="submit">Save details</button>
        </div>
      </form>
    </dialog>

    <script src="renderer.js"></script>
  </body>
</html>
